// ============================================================================
//  rtn.cfg - ROAD TO NOWHERE (userconfig.d)
//  Esta pasta roda DEPOIS do config.cfg, entao estes valores SOBRESCREVEM
//  os cvars salvos (o con_charset default cp1251 do engine).
//  Criado por Hermes e Hidrocarboneto.
// ============================================================================

// Fonte Roboto nas legendas/falas (cp1252 = latim com acentos)
con_charset "cp1252"
cl_charset "utf-8"
// RTN F10 FONTE FIX: a creditsFont (falas) e carregada no SCR_Init com o charset
// DEFAULT (cp1251) ANTES deste cfg rodar. O engine so recarrega a creditsFont
// quando o hud_fontscale muda (FCVAR_CHANGED -> CL_GetScreenInfo). Entao:
// 1) muda o scale p/ um valor diferente (forca a recarga com o cp1252 novo)
// 2) restaura o scale desejado (a segunda mudanca recarrega de novo, ja com a Roboto)
hud_fontscale "0.99"
hud_fontscale "1.0"
hud_fontrender "2"

// ============================================================================
//  Binds do mod (roda por ultimo -> SOBRESCREVE o config.cfg, mesmo se o
//  jogador apagar/recriar o config.cfg, os binds voltam)
// ============================================================================
// RTN: V = estimulante (arma slot 1: equipa + usa automatico), H = painkiller
bind "v" "stimulant_use"
bind "h" "painkiller_use"
// RTN: N = visao noturna (item_nvgoggles). O NVG voltou: agora o ganho de luz
// e feito no auto-exposure (HDR, antes do tonemap) mais um iluminador IR, e
// nao mais por postfx aditivo - ver client/render/gl_nvg.cpp.
// Ajuste fino: rtn_nvg_gain (ganho do tubo), rtn_nvg_ir / rtn_nvg_ir_radius /
// rtn_nvg_ir_intensity (iluminador), rtn_nvg_tint (tint verde + grain).
bind "n" "nvg"
// Lanterna nativa do motor (impulse 100, requer WEAPON_SUIT/HEV, cvar flashlight=1)
bind "f" "impulse 100"
// RTN F10 fix: CORRIDA - o HL classico usa shift = +speed (correr) e ctrl =
// +duck. Se o config.cfg da instalacao nao tiver, o jogador fica sempre em
// WALK (caminhar lento). Estes binds garantem a corrida.
bind "SHIFT" "+speed"
bind "CTRL" "+duck"
// armas: slots 1-5 (padrao HL)
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
